name: Poll job listings

# Vercel's Hobby plan caps its own cron at once per day, so the poller runs here
# instead. Minutes are free on a public repo.
#
# NOTE: GitHub disables scheduled workflows after 60 days with no repository
# activity. Any commit resets that clock.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and report only — no writes, no messages"
        type: boolean
        default: false
      source:
        description: "Poll only this source label (e.g. SimplifyJobs)"
        type: string
        required: false

# Runs are idempotent, but overlapping them wastes a runner and doubles the load
# on every careers page. Queue instead of cancelling so a long run still finishes
# recording what it fetched.
concurrency:
  group: poll-job-listings
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Well above a normal run (~30s). Bounds a hang instead of letting it sit on
    # the runner for the 6-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scrapers/requirements.txt

      # The poller imports the web app's Drizzle schema, so it needs the root
      # install for drizzle-orm and postgres — internships/package.json
      # deliberately omits them to avoid a second, type-incompatible copy.
      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install poller dependencies
        run: bun install --frozen-lockfile
        working-directory: internships

      # Companies that run their own job board have no API to read, so those
      # pages are rendered in Chromium and parsed with BeautifulSoup.
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Poll
        working-directory: internships
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          PROJECT_SECRET: ${{ secrets.PROJECT_SECRET }}
          ALERT_SITE_URL: ${{ vars.ALERT_SITE_URL }}
          # `python` here is the setup-python interpreter, which is the one that
          # has requirements.txt and the Chromium install.
          PYTHON_BIN: python
          SCRAPERS_DIR: ${{ github.workspace }}/scrapers
          # Lifts the GitHub API rate limit from 60/hr to 5,000/hr, which matters
          # when a re-run storm hits the commit-sha checks.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun src/poll.ts \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.source && format('--source={0}', inputs.source) || '' }}

      # The poller reserves a delivery for every enabled subscriber whatever
      # their channel, then sends only the iMessage ones. This drains the Discord
      # rows it left pending. No install step: the sender has no runtime
      # dependencies and resolves drizzle/postgres from the root node_modules.
      #
      # `!cancelled()` rather than the default `success()` on purpose — the two
      # transports share nothing but the ledger, and a Spectrum outage or a single
      # broken scraper shouldn't also hold up the Discord digest.
      - name: Post Discord alerts
        if: ${{ !cancelled() }}
        working-directory: discord
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_MENTION_ROLE_ID: ${{ vars.DISCORD_MENTION_ROLE_ID }}
          DISCORD_USERNAME: ${{ vars.DISCORD_USERNAME }}
          DISCORD_AVATAR_URL: ${{ vars.DISCORD_AVATAR_URL }}
        run: |
          bun src/send-alerts.ts ${{ inputs.dry_run && '--dry-run' || '' }}
